services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chumshow
      POSTGRES_PASSWORD: chumshow
      POSTGRES_DB: chumshow
    ports:
      - "5432:5432"
    volumes:
      - chumshow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chumshow -d chumshow"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  chumshow_pgdata:
